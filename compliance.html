<script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAOO73pfw9yyyukquyOJfjs2nPNQn__XLM",
            authDomain: "los-pericos-46378.firebaseapp.com",
            databaseURL: "https://los-pericos-46378-default-rtdb.firebaseio.com",
            projectId: "los-pericos-46378"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. LOCAL STORAGE CHECK ---
        let activeUser = localStorage.getItem('pericos_active_user');
        let activeRole = localStorage.getItem('pericos_active_role');
        let currentLocation = localStorage.getItem('pericos_location');
        
        if (!activeUser || !currentLocation) {
            window.location.href = 'index.html'; 
        } else {
            document.getElementById('user-display-name').innerText = activeUser;
            if (activeRole === 'Owner') {
                document.getElementById('user-display-role').innerText = 'Owner Access';
            } else {
                let displayLoc = currentLocation.replace('LP_', '');
                document.getElementById('user-display-role').innerText = `${activeRole} • ${displayLoc}`;
            }
        }

        let staffList = [];
        let currentFilter = '';
        let isFirstLoad = true;

        // --- 3. FIREBASE AUTHENTICATION CHECK (THE FIX) ---
        // This forces the page to wait for security clearance before loading or saving data
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // Security passed! Start listening to the database
                startDatabaseSync();
            } else {
                // If security dropped, silently log them back in
                firebase.auth().signInAnonymously();
            }
        });

        // --- 4. LIVE CONNECTION STATUS ---
        const connStatus = document.getElementById('connection-status');
        const connIcon = document.getElementById('connection-icon');
        const connText = document.getElementById('connection-text');

        db.ref('.info/connected').on('value', function(snap) {
            if (snap.val() === true) {
                connStatus.classList.remove('bg-rose-100', 'text-rose-700');
                connStatus.classList.add('bg-emerald-100', 'text-emerald-700');
                connIcon.classList.remove('fa-circle-xmark');
                connIcon.classList.add('fa-signal');
                connText.innerText = 'Live Sync';
            } else {
                connStatus.classList.remove('bg-emerald-100', 'text-emerald-700');
                connStatus.classList.add('bg-rose-100', 'text-rose-700');
                connIcon.classList.remove('fa-signal');
                connIcon.classList.add('fa-circle-xmark');
                connText.innerText = 'Offline';
            }
        });

        // --- 5. UI EVENT LISTENERS ---
        document.getElementById('phone-input').addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        document.getElementById('role-input').addEventListener('change', function(e) {
            const tabcContainer = document.getElementById('tabc-container');
            const tabcInput = document.getElementById('tabc-input');
            
            if (e.target.value === 'Kitchen') {
                tabcContainer.style.display = 'none';
                tabcInput.removeAttribute('required');
                tabcInput.value = ''; 
            } else {
                tabcContainer.style.display = 'block';
                tabcInput.setAttribute('required', 'required');
            }
        });

        document.getElementById('search-staff').addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderTable();
        });

        // --- 6. REALTIME DATA SYNC & MIGRATION ---
        function startDatabaseSync() {
            db.ref(currentLocation + '/compliance').on('value', (snapshot) => {
                staffList = [];
                snapshot.forEach((child) => {
                    staffList.push({ id: child.key, ...child.val() });
                });

                if (isFirstLoad && staffList.length === 0) {
                    let localData = JSON.parse(localStorage.getItem('pericos_compliance'));
                    if (localData && localData.length > 0) {
                        localData.forEach(staff => {
                            db.ref(currentLocation + '/compliance').push({
                                name: staff.name,
                                role: staff.role,
                                phone: staff.phone || '',
                                tabc: staff.tabc || '',
                                fhc: staff.fhc || ''
                            });
                        });
                        localStorage.removeItem('pericos_compliance'); 
                    }
                }
                
                isFirstLoad = false;
                renderTable();
            });
        }

        function getStatusBadge(dateString) {
            if (!dateString) return '<span class="text-slate-400 italic">N/A</span>';
            const today = new Date(); today.setHours(0, 0, 0, 0); 
            const expDate = new Date(dateString); expDate.setHours(0, 0, 0, 0);
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="badge-hospitality badge-expired-h"><i class="fa-solid fa-circle-xmark mr-1.5"></i> Expired (${dateString})</span>`;
            } else if (diffDays <= 31) {
                let countdown = diffDays === 0 ? "Expires Today!" : `In ${diffDays} Days`;
                return `<span class="badge-hospitality badge-soon-h"><i class="fa-solid fa-clock mr-1.5"></i> ${countdown}</span>`;
            } else {
                return `<span class="badge-hospitality badge-valid-h"><i class="fa-solid fa-circle-check mr-1.5"></i> Valid (${dateString})</span>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('staff-table-body');
            tbody.innerHTML = '';
            
            let total = staffList.length; let expiring = 0; let expired = 0;
            const today = new Date(); today.setHours(0, 0, 0, 0);

            const filtered = staffList.filter(s => 
                s.name.toLowerCase().includes(currentFilter.toLowerCase()) || 
                s.role.toLowerCase().includes(currentFilter.toLowerCase()) ||
                (s.phone && s.phone.includes(currentFilter))
            );

            const groupedStaff = filtered.reduce((groups, staff) => {
                const role = staff.role || 'Unassigned';
                if (!groups[role]) groups[role] = [];
                groups[role].push(staff);
                return groups;
            }, {});

            const roleOrder = ['Host', 'Busboy', 'Server', 'Kitchen', 'Manager'];

            roleOrder.forEach(role => {
                if (groupedStaff[role] && groupedStaff[role].length > 0) {
                    
                    const sepRow = document.createElement('tr');
                    sepRow.className = "group-separator";
                    sepRow.innerHTML = `
                        <td colspan="6" class="py-2.5 px-6 text-xs font-bold text-stone-500 uppercase tracking-wider">
                            <i class="fa-solid fa-layer-group mr-2 opacity-50"></i> ${role}s
                        </td>
                    `;
                    tbody.appendChild(sepRow);

                    groupedStaff[role].forEach(staff => {
                        [staff.tabc, staff.fhc].forEach(dateString => {
                            if (dateString) {
                                const expDate = new Date(dateString); expDate.setHours(0,0,0,0);
                                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                                if (diffDays < 0) expired++; else if (diffDays <= 31) expiring++;
                            }
                        });

                        const phoneDisplay = staff.phone ? staff.phone : '<span class="italic text-slate-400">N/A</span>';
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition cursor-default"; 
                        tr.innerHTML = `
                            <td class="py-4 px-6 font-semibold text-slate-800 pl-10">${staff.name}</td>
                            <td class="py-4 px-6 text-slate-500">${staff.role}</td>
                            <td class="py-4 px-6 text-slate-500">${phoneDisplay}</td>
                            <td class="py-4 px-6">${getStatusBadge(staff.tabc)}</td>
                            <td class="py-4 px-6">${getStatusBadge(staff.fhc)}</td>
                            <td class="py-4 px-6 text-right space-x-3">
                                <button onclick="editStaff('${staff.id}')" class="text-slate-400 hover:text-emerald-700 transition"><i class="fa-solid fa-pen-to-square text-lg"></i></button>
                                <button onclick="deleteStaff('${staff.id}')" class="text-slate-400 hover:text-rose-600 transition"><i class="fa-solid fa-trash text-lg"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            });

            document.getElementById('total-staff').innerText = total;
            document.getElementById('expiring-soon').innerText = expiring;
            document.getElementById('expired-count').innerText = expired;
        }

        // --- 7. MODAL & DATA SAVING ---
        function openAddModal() {
            document.getElementById('staff-id').value = '';
            document.getElementById('staff-form').reset();
            document.getElementById('modal-title').innerText = 'Add New Staff Member';
            document.getElementById('role-input').dispatchEvent(new Event('change'));

            const modal = document.getElementById('staff-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.hospitality-modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('staff-modal');
            modal.querySelector('.hospitality-modal').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.getElementById('staff-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Double check security clearance right before saving
            if (!firebase.auth().currentUser) {
                alert("Security Error: Not fully logged in. Please refresh the page.");
                return;
            }

            const name = document.getElementById('name-input').value;
            const role = document.getElementById('role-input').value;
            const phone = document.getElementById('phone-input').value; 
            const tabc = document.getElementById('tabc-input').value || '';
            const fhc = document.getElementById('fhc-input').value;
            
            let id = document.getElementById('staff-id').value;
            let recordRef = id ? db.ref(currentLocation + '/compliance/' + id) : db.ref(currentLocation + '/compliance').push();

            recordRef.set({
                name: name,
                role: role,
                phone: phone,
                tabc: tabc,
                fhc: fhc
            }).then(() => {
                closeAddModal(); 
            }).catch((error) => {
                alert("Error saving record: " + error.message);
            });
        });

        function editStaff(id) {
            const staff = staffList.find(s => s.id === id);
            if (!staff) return;
            document.getElementById('staff-id').value = staff.id;
            document.getElementById('name-input').value = staff.name;
            document.getElementById('role-input').value = staff.role;
            document.getElementById('phone-input').value = staff.phone || ''; 
            document.getElementById('tabc-input').value = staff.tabc || '';
            document.getElementById('fhc-input').value = staff.fhc || '';
            
            document.getElementById('role-input').dispatchEvent(new Event('change'));
            document.getElementById('modal-title').innerText = 'Edit Employee Record';
            
            const modal = document.getElementById('staff-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.hospitality-modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function deleteStaff(id) {
            if (!firebase.auth().currentUser) {
                alert("Security Error: Not fully logged in. Please refresh the page.");
                return;
            }
            if (confirm('Are you sure you want to securely remove this employee record from the database?')) {
                db.ref(currentLocation + '/compliance/' + id).remove().catch((error) => {
                    alert("Error deleting record: " + error.message);
                });
            }
        }
    </script>
