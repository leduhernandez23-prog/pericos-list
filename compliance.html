<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Pericos - Compliance Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { 'soft': '0 10px 25px rgba(0, 0, 0, 0.03)' }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-canvas: #FAF7F2; 
            --accent-gold-trim: #F59E0B; 
            --accent-forest-green: #15803D; 
            --text-hospitality-main: #111827; 
            --text-hospitality-sub: #6B7280; 
        }

        body.hospitality-theme { background-color: var(--bg-canvas) !important; }

        header.border-amber-300 {
            background-color: #FFFFFF !important;
            position: fixed !important;
            top: 0; left: 0; right: 0;
            border-bottom: 2px solid var(--accent-gold-trim) !important;
        }

        .shadow-soft { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03) !important; }

        .hospitality-stat-card,
        .hospitality-container,
        .hospitality-modal {
            border-radius: 12px !important;
            border-color: #E7E5E4 !important; 
        }

        .hospitality-table-header {
            text-transform: uppercase !important;
            letter-spacing: 1px !important; 
            font-size: 11px !important; 
            font-weight: 700 !important; 
            color: #44403C !important; 
            padding-top: 18px !important;
            padding-bottom: 18px !important;
        }

        .hospitality-stat-label,
        .hospitality-label {
            font-size: 11px !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            font-weight: 700 !important;
            color: #57534E !important; 
            margin-bottom: 6px !important;
        }

        .badge-hospitality {
            display: inline-flex !important;
            align-items: center !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            padding: 4px 8px !important;
            border-radius: 6px !important;
            white-space: nowrap !important;
        }

        .badge-valid-h { color: var(--accent-forest-green) !important; background-color: #ECFDF5 !important; }
        .badge-valid-h i { color: var(--accent-forest-green) !important; margin-right: 6px !important; }

        .badge-soon-h { color: #B45309 !important; background-color: #FFFBEB !important; }
        .badge-soon-h i { color: #F59E0B !important; margin-right: 6px !important; }

        .badge-expired-h { color: #BE123C !important; background-color: #FFF1F2 !important; }
        .badge-expired-h i { color: #E11D48 !important; margin-right: 6px !important; }

        .hospitality-table-body tr.cursor-default:hover { background-color: #FAF7F5 !important; }

        .group-separator {
            background-color: #F5F5F4 !important; 
            border-top: 1px solid #E7E5E4 !important;
            border-bottom: 1px solid #E7E5E4 !important;
        }

        .hospitality-input,
        .hospitality-search { background-color: #FFFFFF !important; border-color: #D6D3D1 !important; }
        .hospitality-input:focus,
        .hospitality-search:focus {
            border-color: var(--accent-forest-green) !important;
            box-shadow: 0 0 0 4px rgba(21, 128, 61, 0.1) !important; 
        }

        .hospitality-add-btn,
        .hospitality-save-btn { background-color: var(--accent-forest-green) !important; }
        .hospitality-add-btn:hover,
        .hospitality-save-btn:hover { background-color: #166534 !important; }

        .hospitality-back-btn {
            color: #44403C !important; 
            background-color: #F5F5F4 !important; 
            border-radius: 8px !important;
            padding: 8px 16px !important;
            font-size: 13px !important;
            font-weight: 500 !important;
        }
        .hospitality-back-btn:hover { color: var(--accent-forest-green) !important; background-color: #F0FDF4 !important; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #F5F5F4; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D6D3D1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #A8A29E; }

        #staff-modal:not(.hidden) > .hospitality-modal { animation: modalPopHospitality 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalPopHospitality {
            from { opacity: 0; transform: scale(0.9) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-stone-50 text-slate-800 antialiased hospitality-theme">

    <header class="bg-white px-6 py-3.5 border-b-2 border-amber-300 shadow-soft flex justify-between items-center fixed top-0 left-0 right-0 z-40">
        <div class="flex items-center space-x-3.5">
            <div class="bg-emerald-100 text-teal-800 p-2.5 rounded-md hospitality-nav-icon">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h1 class="text-xl font-bold hospitality-nav-title">
                Los Pericos <span class="font-normal text-slate-500">Master Vault</span>
            </h1>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-right hidden sm:block hospitality-profile-block">
                <p id="user-display-name" class="text-sm font-bold text-slate-800">Team</p>
                <p id="user-display-role" class="text-xs text-slate-500">Access</p>
            </div>
            <a href="index.html" class="hospitality-back-btn transition flex items-center">
                <i class="fa-solid fa-arrow-left mr-2"></i> Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-28 pb-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white border border-stone-200 hospitality-stat-card shadow-soft p-6 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 hospitality-stat-label">Total Staff</p>
                    <h3 id="total-staff" class="hospitality-stat-value mt-1 text-3xl font-bold">--</h3>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl text-emerald-700 hospitality-stat-icon">
                    <i class="fa-solid fa-users text-2xl"></i>
                </div>
            </div>
            <div class="bg-white border border-stone-200 hospitality-stat-card shadow-soft p-6 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 hospitality-stat-label">Expiring Soon</p>
                    <h3 id="expiring-soon" class="hospitality-stat-value mt-1 text-amber-600 text-3xl font-bold">--</h3>
                </div>
                <div class="bg-amber-50 p-4 rounded-xl text-amber-600 hospitality-stat-icon">
                    <i class="fa-solid fa-clock-rotate-left text-2xl"></i>
                </div>
            </div>
            <div class="bg-white border border-stone-200 hospitality-stat-card shadow-soft p-6 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 hospitality-stat-label">Expired</p>
                    <h3 id="expired-count" class="hospitality-stat-value mt-1 text-rose-600 text-3xl font-bold">--</h3>
                </div>
                <div class="bg-rose-50 p-4 rounded-xl text-rose-600 hospitality-stat-icon">
                    <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                </div>
            </div>
        </div>

        <div class="bg-white border border-stone-200 hospitality-container shadow-soft overflow-hidden">
            <div class="p-5 border-b border-stone-200 flex flex-col md:flex-row justify-between items-center gap-4 bg-stone-50/50">
                <div class="w-full md:w-80 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-search text-sm"></i>
                    </span>
                    <input type="text" id="search-staff" placeholder="Search by name, role, or phone..." class="w-full pl-11 pr-4 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-search focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm">
                </div>
                <button onclick="openAddModal()" class="w-full md:w-auto bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2.5 rounded-lg hospitality-add-btn transition flex items-center justify-center space-x-2.5">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Add Employee</span>
                </button>
            </div>

            <div class="overflow-x-auto custom-scrollbar hospitality-table-scroll">
                <table class="w-full text-left border-collapse hospitality-table">
                    <thead class="bg-stone-50">
                        <tr class="border-b border-stone-200 hospitality-table-header">
                            <th class="py-4 px-6">Employee</th>
                            <th class="py-4 px-6">Role</th>
                            <th class="py-4 px-6">Phone</th>
                            <th class="py-4 px-6">TABC Status</th>
                            <th class="py-4 px-6">FHC Status</th>
                            <th class="py-4 px-6 text-right">Manage</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="divide-y divide-stone-100 text-sm hospitality-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="staff-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 transition-opacity duration-300">
        <div class="bg-white rounded-xl w-full max-w-md hospitality-modal shadow-2xl overflow-hidden transform scale-95 opacity-0 transition-all duration-300">
            <div class="px-6 py-4 border-b border-stone-100 bg-stone-50 flex justify-between items-center hospitality-modal-header">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Add New Staff Member</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 hospitality-modal-close"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="staff-form" class="p-6 hospitality-form">
                <input type="hidden" id="staff-id">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold hospitality-label mb-1.5">Full Name</label>
                        <input type="text" id="name-input" required class="w-full px-4 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-input focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold hospitality-label mb-1.5">Position</label>
                            <select id="role-input" class="w-full px-4 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-input focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm cursor-pointer">
                                <option value="Host">Host</option>
                                <option value="Busboy">Busboy</option> 
                                <option value="Server">Server</option>
                                <option value="Kitchen">Kitchen</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold hospitality-label mb-1.5">Phone Number</label>
                            <input type="tel" id="phone-input" placeholder="(555) 555-5555" maxlength="14" class="w-full px-4 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-input focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div id="tabc-container">
                            <label class="block text-sm font-semibold hospitality-label mb-1.5">TABC Expires</label>
                            <input type="date" id="tabc-input" required class="w-full px-3 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-input focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold hospitality-label mb-1.5">FHC Expires</label>
                            <input type="date" id="fhc-input" required class="w-full px-3 py-2.5 bg-white border border-stone-300 rounded-lg hospitality-input focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-8">
                    <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 bg-white border border-stone-300 hover:bg-stone-50 text-slate-700 rounded-lg hospitality-cancel-btn transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg hospitality-save-btn shadow-sm transition">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAOO73pfw9yyyukquyOJfjs2nPNQn__XLM",
            authDomain: "los-pericos-46378.firebaseapp.com",
            databaseURL: "https://los-pericos-46378-default-rtdb.firebaseio.com",
            projectId: "los-pericos-46378"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. AUTHENTICATION CHECK ---
        let activeUser = localStorage.getItem('pericos_active_user');
        let activeRole = localStorage.getItem('pericos_active_role');
        let currentLocation = localStorage.getItem('pericos_location');
        
        if (!activeUser || !currentLocation) {
            window.location.href = 'index.html'; // Kick out if not logged in
        } else {
            document.getElementById('user-display-name').innerText = activeUser;
            if (activeRole === 'Owner') {
                document.getElementById('user-display-role').innerText = 'Owner Access';
            } else {
                let displayLoc = currentLocation.replace('LP_', '');
                document.getElementById('user-display-role').innerText = `${activeRole} • ${displayLoc}`;
            }
        }

        // --- 3. UI EVENT LISTENERS ---
        // Auto-Format Phone Number
        document.getElementById('phone-input').addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // Hide TABC for Kitchen Staff
        document.getElementById('role-input').addEventListener('change', function(e) {
            const tabcContainer = document.getElementById('tabc-container');
            const tabcInput = document.getElementById('tabc-input');
            
            if (e.target.value === 'Kitchen') {
                tabcContainer.style.display = 'none';
                tabcInput.removeAttribute('required');
                tabcInput.value = ''; 
            } else {
                tabcContainer.style.display = 'block';
                tabcInput.setAttribute('required', 'required');
            }
        });

        // Live Search
        document.getElementById('search-staff').addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderTable();
        });

        // --- 4. REALTIME DATA SYNC ---
        let staffList = [];
        let currentFilter = '';

        // Listen for live updates from Firebase
        db.ref(currentLocation + '/compliance').on('value', (snapshot) => {
            staffList = [];
            snapshot.forEach((child) => {
                staffList.push({ id: child.key, ...child.val() });
            });
            renderTable();
        });

        function getStatusBadge(dateString) {
            if (!dateString) return '<span class="text-slate-400 italic">N/A</span>';
            const today = new Date(); today.setHours(0, 0, 0, 0); 
            const expDate = new Date(dateString); expDate.setHours(0, 0, 0, 0);
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="badge-hospitality badge-expired-h"><i class="fa-solid fa-circle-xmark mr-1.5"></i> Expired (${dateString})</span>`;
            } else if (diffDays <= 30) {
                return `<span class="badge-hospitality badge-soon-h"><i class="fa-solid fa-clock mr-1.5"></i> Soon (${dateString})</span>`;
            } else {
                return `<span class="badge-hospitality badge-valid-h"><i class="fa-solid fa-circle-check mr-1.5"></i> Valid (${dateString})</span>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('staff-table-body');
            tbody.innerHTML = '';
            
            let total = staffList.length; let expiring = 0; let expired = 0;
            const today = new Date(); today.setHours(0, 0, 0, 0);

            const filtered = staffList.filter(s => 
                s.name.toLowerCase().includes(currentFilter.toLowerCase()) || 
                s.role.toLowerCase().includes(currentFilter.toLowerCase()) ||
                (s.phone && s.phone.includes(currentFilter))
            );

            const groupedStaff = filtered.reduce((groups, staff) => {
                const role = staff.role || 'Unassigned';
                if (!groups[role]) groups[role] = [];
                groups[role].push(staff);
                return groups;
            }, {});

            const roleOrder = ['Host', 'Busboy', 'Server', 'Kitchen', 'Manager'];

            roleOrder.forEach(role => {
                if (groupedStaff[role] && groupedStaff[role].length > 0) {
                    
                    const sepRow = document.createElement('tr');
                    sepRow.className = "group-separator";
                    sepRow.innerHTML = `
                        <td colspan="6" class="py-2.5 px-6 text-xs font-bold text-stone-500 uppercase tracking-wider">
                            <i class="fa-solid fa-layer-group mr-2 opacity-50"></i> ${role}s
                        </td>
                    `;
                    tbody.appendChild(sepRow);

                    groupedStaff[role].forEach(staff => {
                        [staff.tabc, staff.fhc].forEach(dateString => {
                            if (dateString) {
                                const expDate = new Date(dateString); expDate.setHours(0,0,0,0);
                                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                                if (diffDays < 0) expired++; else if (diffDays <= 30) expiring++;
                            }
                        });

                        const phoneDisplay = staff.phone ? staff.phone : '<span class="italic text-slate-400">N/A</span>';
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition cursor-default"; 
                        tr.innerHTML = `
                            <td class="py-4 px-6 font-semibold text-slate-800 pl-10">${staff.name}</td>
                            <td class="py-4 px-6 text-slate-500">${staff.role}</td>
                            <td class="py-4 px-6 text-slate-500">${phoneDisplay}</td>
                            <td class="py-4 px-6">${getStatusBadge(staff.tabc)}</td>
                            <td class="py-4 px-6">${getStatusBadge(staff.fhc)}</td>
                            <td class="py-4 px-6 text-right space-x-3">
                                <button onclick="editStaff('${staff.id}')" class="text-slate-400 hover:text-emerald-700 transition"><i class="fa-solid fa-pen-to-square text-lg"></i></button>
                                <button onclick="deleteStaff('${staff.id}')" class="text-slate-400 hover:text-rose-600 transition"><i class="fa-solid fa-trash text-lg"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            });

            document.getElementById('total-staff').innerText = total;
            document.getElementById('expiring-soon').innerText = expiring;
            document.getElementById('expired-count').innerText = expired;
        }

        // --- 5. MODAL & DATA SAVING ---
        function openAddModal() {
            document.getElementById('staff-id').value = '';
            document.getElementById('staff-form').reset();
            document.getElementById('modal-title').innerText = 'Add New Staff Member';
            document.getElementById('role-input').dispatchEvent(new Event('change'));

            const modal = document.getElementById('staff-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.hospitality-modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('staff-modal');
            modal.querySelector('.hospitality-modal').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.getElementById('staff-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get values
            const name = document.getElementById('name-input').value;
            const role = document.getElementById('role-input').value;
            const phone = document.getElementById('phone-input').value; 
            const tabc = document.getElementById('tabc-input').value;
            const fhc = document.getElementById('fhc-input').value;
            
            // Use existing ID if editing, otherwise let Firebase generate a new unique key
            let id = document.getElementById('staff-id').value;
            let recordRef = id ? db.ref(currentLocation + '/compliance/' + id) : db.ref(currentLocation + '/compliance').push();

            // Save to Firebase
            recordRef.set({
                name: name,
                role: role,
                phone: phone,
                tabc: tabc,
                fhc: fhc
            }).then(() => {
                closeAddModal(); 
            }).catch((error) => {
                alert("Error saving record: " + error.message);
            });
        });

        function editStaff(id) {
            const staff = staffList.find(s => s.id === id);
            if (!staff) return;
            document.getElementById('staff-id').value = staff.id;
            document.getElementById('name-input').value = staff.name;
            document.getElementById('role-input').value = staff.role;
            document.getElementById('phone-input').value = staff.phone || ''; 
            document.getElementById('tabc-input').value = staff.tabc || '';
            document.getElementById('fhc-input').value = staff.fhc;
            
            document.getElementById('role-input').dispatchEvent(new Event('change'));
            document.getElementById('modal-title').innerText = 'Edit Employee Record';
            
            const modal = document.getElementById('staff-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.hospitality-modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function deleteStaff(id) {
            if (confirm('Are you sure you want to securely remove this employee record from the database?')) {
                // Delete from Firebase
                db.ref(currentLocation + '/compliance/' + id).remove().catch((error) => {
                    alert("Error deleting record: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
